# SURGE Mk.2 車両諸元 — `docs/architecture.md` §5.3
#
# **全ノードがここだけを見る。** 同じ数字を2箇所に書くと必ず片方が古くなる。
#
# 形式について: §5.3 は `config/vehicle.yaml` と書いているが TOML にしてある。
# Python 3.11+ の `tomllib`（標準ライブラリ）で読めるので依存が増えず、
# `raspi/proto/protocol.toml` と同じ流儀に揃うため。中身のスキーマは §5.3 のまま。
#
# ★ 車の性質（[dynamics]・[limits]・[control] の校正の結果・[control.plant]）は**校正**で測る
#   （手順・式・合否は `docs/calibration.md`、解析は `tools/calib`、GUI は launcher の「車両の校正」）。
#   各行のコメントに、どの校正が書くかを書いてある。2026-10-18 に旧システム同定（tools/sysid・tools/ctrl_tune）から作り直した。
#   幾何（ホイールベース・トレッド・リンク比・車輪半径・外形・センサ取付）と質量は 2026-08-20 に実測確定済み。
#   未実測: `encoder_ticks_per_rev`（どのコードも読まない記録用の欄）。measured = false はこの1項目ぶんの印。

measured = false

# ── 幾何 ────────────────────────────────────────────────────────────────
# 原点は base_link ＝ **後輪車軸の中心**（§5.2）。x = 前、y = 左、z = 上。

wheelbase = 0.23              # L [m]
track = 0.155                  # トレッド [m]
# 最大路面舵角 [rad] = 26.56°。**ステアのリンクの換算（[control] の steer_link_*）を、モータの可動範囲
# （モータ角×0.5 で ±30°）に通した値**。システム同定が steer_link_* と一緒に書く（手で変えない）。
# 2026-10-08 までは 0.524（30°）で、これは「モータ角×0.5」の見かけの舵角だった
max_steer = 0.465912
# ステアモータの可動域は機構上 ±60°（1.047 rad）だが、リンク比 0.5（2026-08-20 実測確定）
# によりタイヤ側は半分しか切れない。上の値はタイヤ側（路面舵角）基準。
wheel_radius = 0.03          # [m]
wheel_width = 0.025           # タイヤ幅 [m]（GUI・シムの車体イラスト用。★概算、実測したら直す）
encoder_ticks_per_rev = 0     # ★未確定（STM32 の実測待ち）。どのコードも読まない（記録用の欄）
mass = 2.0                    # 車両質量 [kg]（実測確定）

# 車体外形ポリゴン [m]。base_link 基準・反時計回り。実測確定（2026-08-20）。
# `gui/src/generated/vehicle.ts`（`config/generate.py` の生成物）がこの値をそのまま使う。
footprint = [
  [ 0.30,  0.09],   # 右前 → ではなく左前（y=左が正）
  [ 0.30, -0.09],
  [-0.07, -0.09],
  [-0.07,  0.09],
]

# ── 安全タイマ ──────────────────────────────────────────────────────────
# **同じ数字が3箇所に手書きされていた**（io_node・telemetry_node・GUI の
# `useDriving.ts`）。今は一致しているが、一致していることを保証する仕組みが
# 無かった（2026-08-21 のレビュー 🟢11）。`docs/architecture.md` §9.4 が
# 正とされている値をここに移し、Python は `raspi/core/vehicle.py` 経由で、
# TypeScript は `config/generate.py` の生成物経由で読む。

[safety]
# 指令が途絶してから DISARM に落とすまで [ms]。**二重に持つ**:
#   - telemetry_node: GUI からの `cmd` が途絶 → バスへ DISARM を流す
#   - io_node:        バスの `cmd` が途絶     → STM32 へ DISARM を送る
# 片方が死んでも成立させるための冗長なので、**値そのものは1つに保つ**。
cmd_deadman_ms = 150
# **自律走行中だけ**、GUI からの `cmd` の途絶をここまで待つ [ms]（telemetry_node）。
# 車は planner の指令で走っているので、Wi-Fi が瞬断しただけで止める理由が無い
# （2026-10-06、メッシュ Wi-Fi の中継機の切り替えで走行中に DISARM した）。
# **この間は GUI から止められない**——止まるのは planner 自身の判断（見失い等）と
# `auto_cmd_stale_ms`・物理の電源遮断だけ。手動操縦は `cmd_deadman_ms` のまま
auto_link_grace_ms = 5000
# `auto/cmd` がこれだけ古ければ中継せず制動に読み替える [ms]。
# planning_node は 50Hz で出しているので 10 発ぶんの猶予
auto_cmd_stale_ms = 200
# GUI が COMMAND に**毎回**載せるレート制限（`accel_limit`/`steer_rate_limit`）。
# 自律走行中も `telemetry_node._merge_auto` が GUI の値との小さい方を通す。
# ★`cmd_accel_limit_m_s2` は**目標車速を動かす傾きの上限そのもの**（v0.22〜）。v0.21 までは STM32 が
#   固定の 3.0（DRIVE_MAX_ACCEL_M_S2）で頭打ちにしていたので、ここが 6.0 でも実効は 3.0 だった。
#   STM32 の上限を無くしたので、同じ動きになるよう 3.0 にしてある。planner の加減速の上限
#   （`Vehicle.a_accel_max`・`a_decel_max`）・シム・同定のモデルもこの値を読む。
#   上げるのは、その路面で前後運動試験を録って、グリップで出せる加減速がこれを超えてから
# **実機の舵は常にこの角速度でランプした参照に追従する**（`steer_cmd_echo` がそれ）ので、
# 実ノードを通さないシム（`ml_lidar/env.py`）も同じ値を `DriveInput` に入れる。
# GUI は `config/generate.py` の生成物（`SAFETY.cmdSteerRateLimit` 等）経由で読む
cmd_accel_limit_m_s2 = 3.0
cmd_steer_rate_limit_rad_s = 7.0

# ── 車の性質（校正で測る）────────────────────────────────────────────
# **どの値をどの校正が書くかは各行のコメント**（手順・式は `docs/calibration.md`、解析は `tools/calib`）。
# 「ファームの定数」は STM32 の定数の写しで、`tools/fwsim/tests/test_fw_constants.py` が突き合わせる。

[dynamics]
# ── 校正 3（ステアの遅れ、`calib_steer_dyn`）: 舵を送ってから曲率が付くまで。slam2d の先読み（`Vehicle.steer_delay_s`
#    = むだ時間 + 1次遅れ + 2ζ/ωn）に使う。値は 2026-09-28 の旧ステア試験のもの ──
tau_steer_s = 0.0            # サーボの1次遅れ [s]
dead_time_s = 0.0125           # サーボのむだ時間 [s]
yaw_natural_freq_rad_s = 55.24   # 曲率の2次遅れの固有角振動数 [rad/s]。0 = 無し
yaw_damping = 0.8              # 同 減衰比
# ── 校正 2（ステア、`calib_steer`）: 舵角 → 曲率。[control] の steer_link_* と最上位の max_steer と**一緒に**書く ──
steer_servo_gain = 0.97992   # サーボの定常ゲイン（報告舵角 / 参照舵角）
steer_offset_rad = 0.001993   # 中立のずれ [rad]（正 = 左へ曲がる。Pi が指令から引く）
# 換算（steer_link_*）に畳み込んだ残り。校正 2 は 1 と 0 を書く
steer_gain = 1.0
steer_gain_cubic = 0.0
# ── 校正 4（遅延、`calib_latency`）: スキャン完了 → STM32 受理 [s]。実ノードを通さない学習環境（ml_lidar）も使う ──
control_latency_s = 0.0122
# ── 校正 5（車速制御、`calib_speed` → 確かめ `calib_speed_check`）──
# 車体の利得 [(m/s²)/(N·m)]（後輪2輪の合計トルク → 加速度。車輪の回転の慣性を含む実効の値。名目 16.7）と、
# 転がり抵抗の減速度 [m/s²]（後輪の摩擦を含む）。★2026-09-28 の旧②の値 21.5 は解析の誤り（PI を通した応答に
# 記録時のゲインを既知として当てはめていた）。同じ記録を PI を仮定せずに当てはめると 16.5〜16.8（docs/calibration.md）
speed_plant_gain = 12.796
rolling_resistance = 0.2651
# 車速 PI のゲイン（io_node が CONFIG_SET で STM32 へ送る。`raspi/core/control_params.py` の FROM_DYNAMICS）。
# 校正 5 が測った利得と遅れから位相余裕 60° の式で決める（`tools/calib/loop.py`）。下は v0.26 までの手置きの値
speed_kp = 1.13724
speed_ki = 4.26466
# ── ファームの定数（同定しない）──
speed_torque_max_nm = 0.26      # 車速 PI の出力の上限（DRIVE_MAX_TORQUE_NM × 2輪）
speed_filter_s = 0.00995           # wheel_speed（報告用）のローパス（DRIVE_LPF_TAU_FRONT_S）。シムの観測だけ
speed_filter_order = 1
speed_kf_lag_s = 0.0            # speed（カルマンフィルタ）の遅れ。ファームの式から 0
speed_ff_filter_s = 0.02         # 加速度 FF の目標の傾きのローパス（DRIVE_SPEED_FF_TAU_S）
drive_ratio = 2.0             # 駆動輪数（後輪2輪ぶんのトルクが効く）

# ── slam2d の走りの上限（正味の加速度 [m/s²]）。**走行中の学習（grip_learn）の初期値・学習しないときの上限** ──
# 校正 7（タイヤ、`calib_tyre`）が横を μ から見積もり、校正 8（TC・ABS の確かめ、`calib_traction_check`）が加速・減速を
# 実測して書く。下は旧②③の値を移したもの（横 = μ 0.417·g、加速 = 3.07 − 転がり抵抗、減速 = 2.27 + 転がり抵抗）
[limits]
a_lat_m_s2 = 4.0912
a_accel_m_s2 = 2.7967
a_brake_m_s2 = 2.5413
# 非常時の最大制動（ABS）の減速度 [m/s²]。slam2d は使わない。io_node が CONFIG_SET（★v0.29 `BRAKE_DECEL_M_S2`）で
# STM32 へ送り、自動停止の停止距離と DISARM 後の制動の上限に使う（ファームは値を持たない）。校正 8 が書く
abs_brake_decel_m_s2 = 2.4744

# ── シムの車だけが使う値（`sim/vehicle.py` の `VehicleSpec`。**実機の制御は読まない・同定しない**）──
# 旧①②③で測っていた値をそのまま残してある。slam2d に要らないので測り直さない。
# ★ μ・加速の上限・車速指令の減速の上限・ABS の減速度の 4 つは、**シムは [limits] から作る**（校正 7・8 の実測に
#   シムが追従する。`sim/vehicle.py` の `VehicleSpec.load`）。下の 4 行は [limits] が無いときの予備
[sim]
mu = 0.41718121313132595                     # 横グリップ（限界の横加速度 = mu·g）
drive_accel_m_s2 = 3.0699      # 駆動の加速度の上限（転がり抵抗を引く前）
drive_fade_speed_m_s = 0.0
drive_top_speed_m_s = 0.0
speed_decel_m_s2 = 2.2680561093986737      # 車速指令の減速の上限
brake_decel_m_s2 = 2.4743645729434935      # 制動（ABS）の減速度の頭打ち
brake_decel_per_nm = 37.55321111712028    # 制動トルク → 減速度の傾き
brake_boundary_speed_m_s = 0.6   # MD の制動の境界層（MD のファームの定数）
brake_deadband_speed_m_s = 0.06  # 同 不感帯
steer_rate_limit_rad_s = 0.0   # サーボの物理的な最大角速度。0 = 制限なし
steer_servo_hysteresis_rad = 0.015899999999999997
steer_link_hysteresis_rad = 0.0
steer_link_deadband_rad = 0.0
understeer_gradient = 0.0
yaw_relaxation_m = 0.0
yaw_rate_filter_s = 0.00875536712801091    # STM32 の yaw_rate のローパス（観測だけ）
tau_speed_s = 0.14957988168793218       # 旧モデル（1次遅れ）。speed_kp > 0 の間は使わない

# ─────────────────────────────────────────────────────────────
# 足回りの制御（TC・ABS・片輪浮き対策・TV）の調整パラメータと、STM32 が使う校正の結果
#
# **ここが唯一の定義。** io_node が STM32 へ接続するたびに全項目を CONFIG_SET で送り、
# CONFIG_ACK の「実際に入った値」と一致するまで再送する。その後も順番に読み戻し続け、STM32 だけが
# 再起動して既定値へ戻ったら送り直す（`raspi/core/control_params.py`。状態は GUI の診断・
# `diag/link` の `control_params_status`）。STM32 は Flash に保存しない。
# キーは STM32 側 `src/control/control_params.h` の表のフィールド名で、範囲もそこが決める
# （範囲外は STM32 が丸め、`control_params_status` が `mismatch` になる）。
# STM32 の既定値は「何もしない」仮置き（各範囲の下限。リンクの換算だけ 1 と 0）で、ここの値を送るまで
# io_node は ARM を通さない。
# ─────────────────────────────────────────────────────────────
[control]
# ── 機能の ON/OFF（0/1）。**STM32 の既定は無効**で、io_node が接続のたびにここの値を送って有効にする。
#    書かなければ無効のまま走る。GUI「設定 → 走行アシスト」で切り替えた値はその接続のあいだだけ有効で、
#    再接続・STM32 の再起動のあとはここの値へ戻る。ABS・片輪浮き対策（abs_enable・wheel_lift_guard_enable）も
#    書けるが、ファームの既定が有効なので今は書いていない ──
tc_enable = 1
tv_enable = 1
# スリップ率の分母の下限 [m/s]。スリップ率 = スリップ速度 / max(|基準速度|, これ)。これより遅い間は
# 「スリップ速度が この値×目標スリップ率 を超えたか」で見る（発進の空転もここで捕まえる）
slip_speed_floor_m_s = 0.5
# ── TC（駆動・車速指令の減速。各輪独立）: スリップ率を目標に保つ PI。出力はトルクの上限 ──
# **校正 7（タイヤ、`calib_tyre`）が書く**: 目標 = 曲線の山の 95% の力が出るスリップ率、ゲイン = 目標の点で線形化した
# スリップの動きと校正 6 の遅れから位相余裕 60° の式（`tools/calib/tyre.py`）。効きは校正 8 が確かめる。
# 下は 2026-10 の旧数値最適化の値（位相余裕に直すと約 58° で、新しい式とほぼ同じ）
tc_slip_target = 0.2332
tc_kp_nm_per_m_s = 0.06731        # スリップ速度の偏差 [m/s] → トルクの上限 [N·m]
tc_ki_nm_per_m = 0.7941         # 同 積分 [N·m/(m/s)/s]
tc_min_torque_nm = 0.0        # トルクの上限の下限。0 でよい（浮いた輪は 0.005 でも回り続ける）
# ── 片輪浮き対策: 後輪左右の速度差（ヨーレートで説明できる分を除く）がこれを超えたら、
#    先走っている輪を TC と同じ PI で絞る [m/s]。前輪エンコーダが壊れても働く見張り ──
wheel_lift_diff_threshold_m_s = 0.35
# ── ABS（制動モード。左右共通 = ロックしかけている側に合わせる）。**校正 7 が書く**（TC と同じ式）。
#    下の旧値は位相余裕 約 26° と攻めていた ──
abs_slip_target = 0.2731
abs_kp_nm_per_m_s = 0.09177
abs_ki_nm_per_m = 1.3044
# ── TV（後輪左右の荷重に比例した配分。★プロトコル v0.17。フィードフォワードのみ）──
# 左右のトルク差 = 総駆動トルク × clamp(tv_load_gain_s2_per_m × 車速 × ヨーレート, ±tv_max_ratio)。
# 旋回で荷重の乗る外輪へ多く配り、荷重の抜けた内輪を空転させない（定速の旋回ではほぼ何もしない）。
# 比率の理論値 = 横加速度あたりに外輪へ移る荷重 ÷ 後輪1つの静止荷重
#   = [control.plant] の lateral_transfer(机上 0.13) × mass ÷ fz_static_n(机上 5.75) ≒ 0.045。
# 実機では未調整——旋回しながらの加速で、内輪と外輪の滑り率（診断タブ）がそろう値を探す。0 で TV なし
tv_load_gain_s2_per_m = 0.045
tv_max_ratio = 0.5            # 比率の上限。1 で内輪のトルクが 0
# ── ステアのリンクの換算（★プロトコル v0.18。**校正 2（ステア、`calib_steer`）が書く**）──
# 路面舵角 = steer_link_gain·x + steer_link_cubic·x³、x = ステアモータの角度×0.5 [rad]。STM32 がこの式で
# 指令（路面舵角→モータ角）と報告（モータ角→路面舵角）を換算し、車速（前輪の速度×cos 路面舵角）も
# これで決まる。リンクが複雑で設計から式を出せないため、低速の弧の曲率から測る。
# [dynamics] の steer_gain=1・steer_gain_cubic=0・steer_offset_rad と最上位の max_steer と一緒に書く
# （**そろって初めて意味が合う。片方だけ手で変えない**）。値は 2026-09-28 の旧同定値（2026-10-18 の旧ステア試験の
# 記録を新しい解析に通すと、実際の舵角との差は 10° で +0.3°・20° で +0.4°）
steer_link_gain = 1.069683
steer_link_cubic = -0.656038
# ── ローンチコントロール（★プロトコル v0.20。手動操作の発進（GUI）・planner が `launch` を立てた発進で、STM32 が目標車速の
#    ランプと車速PIを迂回して全開＋TC で加速する。空転を抑えるのは上の TC の値）──
# 発進を終えて車速PIへ戻すときの積分の初期値 [N·m、1輪あたり] = その車速を保つのに要るトルク
# = rolling_resistance ÷ speed_plant_gain ÷ 2。**校正 5 が書く**
launch_exit_torque_nm = 0.01036

# ── 車速PIの加速度フィードフォワード（★プロトコル v0.21。後輪2輪の合計トルク [N·m]）──
# STM32 は車速PIの出力に「speed_ff_nm_per_m_s2 × 目標車速の傾き [m/s²] ＋ speed_ff_rr_nm × 進む向き」を足す。
# 加速に要るトルクを先に足せば、PI は残ったずれだけを直せばよい（2 自由度制御）。**校正 5 が書く**:
# speed_ff_nm_per_m_s2 = 1 ÷ speed_plant_gain、speed_ff_rr_nm = rolling_resistance ÷ speed_plant_gain。
# 0 にすると無効で、planner は Pi 側で遅れを見込む旧方式に戻る
speed_ff_nm_per_m_s2 = 0.07815
speed_ff_rr_nm = 0.02072

# ── 前輪エンコーダの校正（★プロトコル v0.27。調整値ではなく**校正の結果**。STM32 `lib/encoder_cal`）──
# アナログ出力の絶対角エンコーダ（AS5600）の読みを STM32 が真の角度へ直してから、車速・`odom_dist`・
# 各輪の周速にする。**手で書かない**: 校正 1（前輪エンコーダ、`calib_encoder`）が書く。
#   enc_*_lo・hi: 角度 0・2π に当たる ADC の読み（フルスケールに対する比）。出力の範囲が電源電圧の全域でないと、
#                 1回転が 2π より小さく読めて走行距離の倍率と 0/2π の境目の段差になる
#   enc_*_h1s…h2c: 1回転の周期誤差 e(θ) = h1s·sinθ + h1c·cosθ + h2s·sin2θ + h2c·cos2θ [rad]（θ は取付向きの符号のまま）。
#                 2026-10-17 の走行記録の推定では左 ±1.1°・右 ±2.3°（右はデータシートの INL ±1° を超える。磁石のずれの疑い）
# 下の値は 2026-10-18 11:39 の記録の校正 1（左 ±1.2°・右 ±3.2°）。この校正を入れた STM32 で録った記録で、走行距離に
# 残る周期誤差が ±0.1〜0.2° に落ちることを確かめてある（同じ日の別の記録とは係数が 0.1° 程度で一致）
enc_left_lo = 0.002212
enc_left_hi = 0.999179
enc_left_h1s = -0.002309
enc_left_h1c = -0.002083
enc_left_h2s = 0.00235
enc_left_h2c = 0.014632
enc_right_lo = 0.000987
enc_right_hi = 0.998546
enc_right_h1s = 0.015905
enc_right_h1c = 0.015194
enc_right_h2s = -0.028718
enc_right_h2c = 0.011694
# ── 車速のカルマンフィルタの調整値（★v0.27。STM32 `src/control/speed_kf.h`）──
# 下の値は v0.26 の固定値（一部は 2026-10-16・17 の記録1本から決めた経験値。`docs/control_constants.md`）。
# 検定は `raspi/tools/kf_consistency.py`（NIS≈1・相関≈0 になること）
kf_sigma_s_m = 0.0008           # 走行距離の測定ノイズ [m]（★周期誤差を白色雑音として逃がすための水増し。校正後に下げる）
kf_sigma_a_m_s2 = 0.6           # 加速度の測定ノイズ [m/s²]（車速 0 のとき）
kf_sigma_a_per_m_s = 0.0        # 同 車速 1m/s あたりの増え方（走行中の振動は車速とともに増える）
kf_jerk_psd = 100.0             # 加速度の変化の強さ [m²/s⁵]（経験値）
kf_bias_walk_psd = 0.05         # 加速度計のバイアスの変化の強さ [(m/s²)²/s]（経験値）
kf_lever_arm_m = 0.15           # 旋回で加速度計に乗る −k·ω² の補正 [m]（2026-10-16 の記録1本の回帰）
# ── ジャイロ z 軸の感度の補正（★プロトコル v0.28。STM32 の imu.c がバイアスを引いた後の z に掛ける）──
# MPU6050 の感度の公差は ±3% で、ヨーレート・曲率・向きの積分の倍率にそのまま乗る。**校正の試験は無い（手で置く）**。
# 1.0 = データシートの感度のまま（補正なし）
imu_gyro_z_scale = 1.0

# TC・ABS の設計と確かめ（ホストでコンパイルしたファームのシム）に使う車輪・タイヤのモデル。Pi の制御は読まないが、
# md_delay_s + md_tau_s だけは io_node が自動停止の判断の遅れとして STM32 へ送る（★v0.29 `MD_TORQUE_LAG_S`）。
# **校正 6（後輪の空転、`calib_wheel`）**が wheel_* と md_*（MD のトルク＋速度の報告の遅れの合計）、
# **校正 7（タイヤ）**が mu・tyre_b・tyre_c を書く。yaw_* は 2026-10-05 のヨーモーメント試験の値（TV は同定しない）
[control.plant]
mu = 1.2386
tyre_b = 12.452
tyre_c = 0.3
load_transfer = 0.13324492181757844
yaw_damping = 1.6390035452184182
yaw_inertia_kgm2 = 0.014779822379128905
wheel_inertia_kgm2 = 3.458e-05
wheel_friction_nm = 0.003015
wheel_damping_nms = 1.729e-05
md_delay_s = 0.0045
md_tau_s = 0.012

# ── センサ取付位置 ──────────────────────────────────────────────────────
# base_link からの固定変換。実測確定（2026-08-20）。

[sensors.lidar]
x = 0.07
y = 0.0
z = 0.110
yaw = 0.0
# LD06 は裏向きに実装されているため、センサ角と車両角が鏡像関係になる。
# その反転は `raspi/msgs/convert.py` の ScanAssembler が行う（ここでは表現しない）。
# **この `mirrored` はどのコードも読まない（記録用の欄）。** 反転は ScanAssembler に固定で入っている
mirrored = true

[sensors.cam_front]
# ★付いているレンズ。下の `[sensors.cam_front.lenses.<名前>]` から選ぶ。
# **レンズを付け替えたらここだけ直して `tools/deploy.sh --restart`。**
#   "stock"   … 純正 IMX219（水平 ≒66°）
#   "wide160" … IMX219 160° 広角（魚眼）
# 名前に `_` は使わない（📷 のファイル名に入る）。
# **取付位置・姿勢（x y z roll pitch yaw）もレンズごとのプロファイルに持つ**（カメラモジュールを
# 替えるとステーも変わるので、替える前の実測値を消さずに残すため）
lens = "wide160"

# ── レンズごとの値。項目の意味 ──
# x y z          [m] base_link（後輪車軸中心）基準の取付位置。z は路面からの高さ（レンズ中心）
# roll pitch yaw [rad] 取付姿勢。pitch は下向きが正。取り付け角度そのもの＝付け直さない限り変わらない
# hfov           [rad] 水平画角。**`fisheye`（校正値）が無い間だけ**ピンホール近似に使う。
#                ピンホールは 180° に届かないので、校正後もここは書き換えない
#                （実測の画角は `fisheye.hfov_deg` に参考値として入る）
# bottom_crop    下端カット率。ボンネット等の映り込みを ISP の ScalerCrop で読み出し時に切る
#                （`raspi/nodes/camera_node.py` の `bottom_cropped`）。GUI の進路ガイドの主点補正にも使う
# undistort_hfov [rad] 補正映像（GUI の「魚眼/補正」、`telemetry_node`）の仮想ピンホールの水平画角
# isp_tuning     色むら補正の差分（`config/cam_tuning/` のファイル名）。**書かなければセンサー標準のまま**
#                （純正レンズは標準が合っているので書かない）。標準の補正は純正レンズ用で、広角レンズに
#                そのまま当てると周辺がピンクに写る。白い壁を撮って `raspi/tools/alsc_calib.py` で作る。
#                ★libcamera の制約でプロセスに1つしか効かない。前後で違う値にすると前カメラのものが
#                両方に当たる（`raspi/core/cam_tuning.py`）
# fisheye        魚眼の校正値（`[….lenses.<名前>.fisheye]`）。**手で書かない。** チェッカーボード
#                写真から `tools/cam_calib`（ランチャーの「カメラ校正」）が書く。値の意味は
#                `raspi/core/camera_model.py`（Kannala-Brandt、フル画角・クロップ前の画素）。
#                無ければ未校正＝`hfov` のピンホール

