# SURGE Mk.2 車両諸元 — `docs/architecture.md` §5.3
#
# **全ノードがここだけを見る。** 同じ数字を2箇所に書くと必ず片方が古くなる。
#
# 形式について: §5.3 は `config/vehicle.yaml` と書いているが TOML にしてある。
# Python 3.11+ の `tomllib`（標準ライブラリ）で読めるので依存が増えず、
# `raspi/proto/protocol.toml` と同じ流儀に揃うため。中身のスキーマは §5.3 のまま。
#
# ★ 実測できていないのは [dynamics]（アクチュエータの動特性）と
#   `encoder_ticks_per_rev`（STM32 側の実測待ち）だけ。
#   幾何（ホイールベース・トレッド・リンク比・車輪半径・外形・センサ取付。後輪は
#   ダイレクトドライブでギア比の概念がない）と質量は 2026-08-20 に実測確定済み。
#   measured = false はこの残りぶんの印。

measured = false

# ── 幾何 ────────────────────────────────────────────────────────────────
# 原点は base_link ＝ **後輪車軸の中心**（§5.2）。x = 前、y = 左、z = 上。

wheelbase = 0.23              # L [m]
track = 0.155                  # トレッド [m]
max_steer = 0.524             # 最大路面舵角 [rad] = 30°
# ステアモータの可動域は機構上 ±60°（1.047 rad）だが、リンク比 0.5（2026-08-20 実測確定）
# によりタイヤ側は半分しか切れない。上の値はタイヤ側（路面舵角）基準。
wheel_radius = 0.03          # [m]
encoder_ticks_per_rev = 0     # ★未確定（STM32 の実測待ち）
mass = 2.0                    # 車両質量 [kg]（実測確定）

# 車体外形ポリゴン [m]。base_link 基準・反時計回り。実測確定（2026-08-20）。
# `gui/src/generated/vehicle.ts`（`config/generate.py` の生成物）がこの値をそのまま使う。
footprint = [
  [ 0.30,  0.09],   # 右前 → ではなく左前（y=左が正）
  [ 0.30, -0.09],
  [-0.07, -0.09],
  [-0.07,  0.09],
]

# ── 安全タイマ ──────────────────────────────────────────────────────────
# **同じ数字が3箇所に手書きされていた**（io_node・telemetry_node・GUI の
# `useDriving.ts`）。今は一致しているが、一致していることを保証する仕組みが
# 無かった（2026-08-21 のレビュー 🟢11）。`docs/architecture.md` §9.4 が
# 正とされている値をここに移し、Python は `raspi/core/vehicle.py` 経由で、
# TypeScript は `config/generate.py` の生成物経由で読む。

[safety]
# 指令が途絶してから DISARM に落とすまで [ms]。**二重に持つ**:
#   - telemetry_node: GUI からの `cmd` が途絶 → バスへ DISARM を流す
#   - io_node:        バスの `cmd` が途絶     → STM32 へ DISARM を送る
# 片方が死んでも成立させるための冗長なので、**値そのものは1つに保つ**。
cmd_deadman_ms = 150
# `auto/cmd` がこれだけ古ければ中継せず制動に読み替える [ms]。
# planning_node は 50Hz で出しているので 10 発ぶんの猶予
auto_cmd_stale_ms = 200

# ── アクチュエータの動特性 ──────────────────────────────────────────────
# **すべて実測待ちの仮値。** シミュレータと、将来のフィードフォワード制御が使う。
# 実車で測る手順: 舵角ステップ入力 → TELEMETRY の steer_actual をログに取り、
# 立ち上がりの遅れ（= dead_time_s）と 63.2% 到達時間（= tau_steer_s）を読む。

[dynamics]
tau_steer_s = 0.0670422628123148            # 操舵の1次遅れ時定数 [s]  ★未実測
dead_time_s = 0.010269640133013274           # 操舵のむだ時間 [s]  ★未実測
# ステアサーボの物理的な最大角速度 [rad/s]  ★未実測
# 実測手順はtau_steer_s/dead_time_sと同じステップ入力試験のログから、
# 観測された |d(steer_actual)/dt| の最大値を読む（システム同定タブ「ステア試験」）
steer_rate_limit_rad_s = 10.802314434752011
tau_speed_s = 0.14957988168793218            # 速度応答の1次遅れ時定数 [s]  ★未実測
rolling_resistance = 0.35     # 転がり抵抗による減速度 [m/s²]  ★未実測
# ★対象外: sim/gym_env.py の学習ループは常に armed=True の速度指令モードで
# シムを駆動し、rolling_resistanceが効くのはtorque_mode/unarmed(惰行)の
# コードパスだけなので、実測してもml_lidarのシム精度には反映されない
drive_ratio = 2.0             # 駆動輪数（後輪2輪ぶんのトルクが効く）
# 横方向グリップ限界 a_lat_max = mu * g [m/s²]。値そのものは車両質量に依存しない
# （F_lat_max = mu*m*g を質量mで割ると mu*g だけが残るため）。0.8は屋内床+ゴム系
# タイヤを想定した仮の推定値 ★未実測（実測手順: 定常円旋回でタイヤが滑り出す
# 速度と半径を計測し、mu = v^2/(r*g) で逆算する）
mu = 0.45437614678899085
# 実測の最大加速度・減速度 [m/s²]。0.0 = 未実測（sim/vehicle.pyはMAX_BRAKE_TORQUE_NM
# からの逆算・cmd.accel_limitにフォールバック）。ハードウェアのトルク仕様値ではなく、
# 実際にタイヤが発生できた加減速度（グリップ限界含む）を使いたいため独立に測る
# （実測手順: システム同定タブ「加減速試験」。直進で加速→急制動を繰り返し、
# TELEMETRYのaccel_x（縦加速度）から読む）
drive_accel_m_s2 = 3.7329        # ★未実測
brake_decel_m_s2 = 3.98325        # ★未実測

# ── センサ取付位置 ──────────────────────────────────────────────────────
# base_link からの固定変換。実測確定（2026-08-20）。

[sensors.lidar]
x = 0.07
y = 0.0
z = 0.110
yaw = 0.0
# LD06 は裏向きに実装されているため、センサ角と車両角が鏡像関係になる。
# その反転は `raspi/msgs/convert.py` の ScanAssembler が行う（ここでは表現しない）
mirrored = true

[sensors.cam_front]
x = 0.097
y = 0.0
z = 0.085
roll = 0.0
pitch = 0.0                   # 下向きが正。取り付け角度そのもの＝一度決めたら変わらない
yaw = 0.0
hfov = 1.152                  # [rad] ≒ 66°
# ボンネット等の映り込みを除くため ISP の ScalerCrop で下端を切る
# （`raspi/nodes/camera_node.py` の `bottom_cropped` が実際の読み出しに反映する）。
# GUI の進路ガイド（`CameraView.tsx`）は上端基準でこの分だけ主点が下にずれる補正に使う。
bottom_crop = 0.25             # 下端カット率（下1/4）

[sensors.cam_rear]
x = 0.044
y = 0.0
z = 0.085
roll = 0.0
pitch = 0.0
yaw = 3.14159265
hfov = 1.152
bottom_crop = 0.0625           # 下端カット率（下1/16）

[sensors.us_front]
x = 0.26
y = 0.0
z = 0.060
yaw = 0.0

[sensors.us_rear]
x = -0.040
y = 0.0
z = 0.060
yaw = 3.14159265
