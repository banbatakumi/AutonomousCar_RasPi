# SURGE Mk.2 車両諸元 — `docs/architecture.md` §5.3
#
# **全ノードがここだけを見る。** 同じ数字を2箇所に書くと必ず片方が古くなる。
#
# 形式について: §5.3 は `config/vehicle.yaml` と書いているが TOML にしてある。
# Python 3.11+ の `tomllib`（標準ライブラリ）で読めるので依存が増えず、
# `raspi/proto/protocol.toml` と同じ流儀に揃うため。中身のスキーマは §5.3 のまま。
#
# ★ [dynamics] は `tools/sysid/` のシステム同定で測る（`tools/sysid/toml_update.py` の
#   `ALLOWED_KEYS` が書き込める項目）。**2026-09-24 に同定の手順と解析を全面的に
#   作り直した**（出力誤差法で `sim/vehicle.py` そのものを当てはめる方式）。2026-09-27 に試験を
#   4つ（①ステア ②前後運動 ③旋回グリップ ④遅延）に組み直した（速度応答と加減速を②にまとめた）。
#   **[dynamics] の同定する項目はすべて 2026-09-28 に新しい手順で実機を測った値**（ABS・TC・TV を
#   直したファーム。手順は `docs/development.md` の「システム同定」、結果は PROGRESS.md 2026-09-28 節）。
#   ファームの ABS・TC・TV を変えたら②（TV なら①③も）を測り直すこと。
#   未実測: `encoder_ticks_per_rev`（STM32 側の実測待ち）。
#   幾何（ホイールベース・トレッド・リンク比・車輪半径・外形・センサ取付。後輪は
#   ダイレクトドライブでギア比の概念がない）と質量は 2026-08-20 に実測確定済み。
#   measured = false はこの残り1項目ぶんの印。

measured = false

# ── 幾何 ────────────────────────────────────────────────────────────────
# 原点は base_link ＝ **後輪車軸の中心**（§5.2）。x = 前、y = 左、z = 上。

wheelbase = 0.23              # L [m]
track = 0.155                  # トレッド [m]
max_steer = 0.524             # 最大路面舵角 [rad] = 30°
# ステアモータの可動域は機構上 ±60°（1.047 rad）だが、リンク比 0.5（2026-08-20 実測確定）
# によりタイヤ側は半分しか切れない。上の値はタイヤ側（路面舵角）基準。
wheel_radius = 0.03          # [m]
encoder_ticks_per_rev = 0     # ★未確定（STM32 の実測待ち）
mass = 2.0                    # 車両質量 [kg]（実測確定）

# 車体外形ポリゴン [m]。base_link 基準・反時計回り。実測確定（2026-08-20）。
# `gui/src/generated/vehicle.ts`（`config/generate.py` の生成物）がこの値をそのまま使う。
footprint = [
  [ 0.30,  0.09],   # 右前 → ではなく左前（y=左が正）
  [ 0.30, -0.09],
  [-0.07, -0.09],
  [-0.07,  0.09],
]

# ── 安全タイマ ──────────────────────────────────────────────────────────
# **同じ数字が3箇所に手書きされていた**（io_node・telemetry_node・GUI の
# `useDriving.ts`）。今は一致しているが、一致していることを保証する仕組みが
# 無かった（2026-08-21 のレビュー 🟢11）。`docs/architecture.md` §9.4 が
# 正とされている値をここに移し、Python は `raspi/core/vehicle.py` 経由で、
# TypeScript は `config/generate.py` の生成物経由で読む。

[safety]
# 指令が途絶してから DISARM に落とすまで [ms]。**二重に持つ**:
#   - telemetry_node: GUI からの `cmd` が途絶 → バスへ DISARM を流す
#   - io_node:        バスの `cmd` が途絶     → STM32 へ DISARM を送る
# 片方が死んでも成立させるための冗長なので、**値そのものは1つに保つ**。
cmd_deadman_ms = 150
# `auto/cmd` がこれだけ古ければ中継せず制動に読み替える [ms]。
# planning_node は 50Hz で出しているので 10 発ぶんの猶予
auto_cmd_stale_ms = 200
# GUI が COMMAND に**毎回**載せるレート制限（`accel_limit`/`steer_rate_limit`）。
# STM32 側の保険で、自律走行中も `telemetry_node._merge_auto` が GUI の値をそのまま通す。
# **実機の舵は常にこの角速度でランプした参照に追従する**（`steer_cmd_echo` がそれ）ので、
# 実ノードを通さないシム（`ml_lidar/env.py`）も同じ値を `DriveInput` に入れる。
# GUI は `config/generate.py` の生成物（`SAFETY.cmdSteerRateLimit` 等）経由で読む
cmd_accel_limit_m_s2 = 6.0
cmd_steer_rate_limit_rad_s = 7.0

# ── アクチュエータの動特性 ──────────────────────────────────────────────
# `sim/vehicle.py` のモデルそのもの（`SteerServo`・`SpeedController`・`VehicleSpec.curvature`）
# を実機ログへ当てはめた値。キーごとにどの試験で測るかを書いておく
# （`tools/sysid/gui.py` の `TESTS` と対応）。

[dynamics]
# ── ① ステア試験（`sysid_steer`）: steer_cmd_echo → steer_actual の出力誤差フィット。
#    走行中（1.0m/s・±5〜15°）のステップの値を使う ──
tau_steer_s = 7.580167827161243e-05            # 操舵の1次遅れ時定数 [s]（2026-09-28 実測。ほぼ0＝MD の位置ループが速い）
dead_time_s = 0.006049822997010882           # 操舵のむだ時間 [s]（2026-09-28 実測）
# ステアサーボ出力側の物理的な最大角速度 [rad/s]。0 = 制限なし。
# COMMAND の steer_rate_limit（[safety] 7.0rad/s）でランプした参照より速くは
# 動かないので、それより速い物理上限は観測できない（その場合フィットは 0 を返す。2026-09-28 も 0）
steer_rate_limit_rad_s = 0.0
# サーボのヒステリシス [rad]: 実舵角が止まる位置の幅（階段の小さな段差から。2026-09-28 実測 2.81°）。0 = 無し。
# ★解析はこの①に★を出す（止まる位置が毎回少し違い、5°以上の段差で平均0.2°行き過ぎる——1次遅れ＋幅の
# モデルでは表せない本物の違い）。値そのものは確かなので適用した
steer_servo_hysteresis_rad = 0.049100000000000005
# サーボの位置ループの定常ゲイン（実舵角 / 参照舵角）。1.0 = 定常偏差なし
steer_servo_gain = 1.0
# ── ② 前後運動試験（`sysid_accel`、直線。加速度を段階的に上げる）: 速度制御の形と車体 ──
# シムの速度はファームの速度制御そのもの（`sim/vehicle.py` の `SpeedController`、2026-09-26〜）:
# 目標速度を speed_ramp_max_m_s2 でランプ → PI（speed_kp・speed_ki、出力 ±speed_torque_max_nm）→
# 車体（加速度 = speed_plant_gain × トルク − rolling_resistance）。
# **次の4つはファームの定数で同定しない**（MainF446RE_V3 `src/control/drive.h` の DRIVE_SPEED_KP・
# DRIVE_SPEED_KI・DRIVE_MAX_TORQUE_NM×2輪・DRIVE_MAX_ACCEL_M_S2）。ファームを変えたらここも直すこと
speed_kp = 0.25
speed_ki = 0.5
speed_torque_max_nm = 0.30
speed_ramp_max_m_s2 = 3.0
# 車体の利得 [(m/s²)/(N·m)]（名目 1/(車輪半径×質量) = 16.7）。2026-09-28 実測（前後運動試験）
speed_plant_gain = 20.300025764938727
# 転がり抵抗による減速度 [m/s²]（前後運動試験で利得と一緒に当てはめる）。2026-09-28 実測
rolling_resistance = 0.3662739068320438
# 旧モデル（1次遅れ）の時定数 [s]。speed_kp > 0 の間は使わない（テスト・旧設定との互換のため残す）
tau_speed_s = 0.14957988168793218
# STM32 が speed/wheel_speed に掛けているローパス（1次遅れ×段数、各段の時定数 [s]）。
# **同定しない。ファームの定数**（MainF446RE_V3 `src/control/drive.h` の DRIVE_LPF_K_FRONT=0.951 を
# 2kHz で回す 1次遅れ: τ = -0.0005/ln(0.951) = 9.95ms。2026-09-25 に 100ms から変更）。
# ファームを変えたらここも直すこと。シムの観測（テレメトリ・学習の入力）の遅れにだけ効く。
# 同定の解析は speed ではなくオドメトリをゼロ位相で微分した速度を使うので、この値に依存しない
# （解析の所見「速度センサの自己点検」が、この値と記録の speed の食い違いを警告する）
speed_filter_s = 0.00995
speed_filter_order = 1
# ── ③ 旋回グリップ試験（`sysid_corner`）──
# 横方向グリップ限界 a_lat_max = mu * g [m/s²]。質量に依存しない（F_lat_max = mu*m*g を質量mで割ると
# mu*g だけが残るため）。2026-09-28 実測: 後輪が先に滑った限界 4.48m/s²（1.54m/s）。TV が外輪を押し続けていた
# 旧ファームでは 4.91 だった——**TV の設定で変わる**。ファームの TV の横加速度の上限（`TV_MAX_LATERAL_ACCEL_M_S2`）を
# この約0.92倍（4.1）にしている——測り直したらファームも揃えること
mu = 0.45630387485252794
# ── ①②③をまとめて（`fit_geometry`）──
# タイヤ角 d = 不感帯(ガタ(steer_actual))、曲率 = tan(gain·d + cubic·d³ + offset) / (L + K·v²)
# リンクのガタ [rad]: タイヤ角の、左右から切ったときの差。steer_actual（モータ角）には
# 見えず曲率にだけ出る（掃引から）。0 = 無し
steer_link_hysteresis_rad = 0.0
# 中立付近の不感帯の幅 [rad]（掃引の0°付近と±15°付近の小さな往復を比べて）。0 = 無し
steer_link_deadband_rad = 0.0
# 実効舵角の倍率と3次の項 [1/rad²]（全域の掃引・走行中の小舵角・旋回から）。2026-09-28 実測。
# **ファームの TV の規範（MainF446RE_V3 `torque_vectoring.h` の TV_STEER_GAIN / TV_STEER_GAIN_CUBIC）に
# 同じ値を入れている。測り直したらファームも揃えること**（TV が押す量が変わると、この値も少し変わる）
steer_gain = 0.9928283286067912
steer_gain_cubic = -0.3917425334597521
# ヨーの遅れ: タイヤの緩和長 [m]（舵を切ってから曲率がついてくるまでの走行距離。車の動きに効く）と、
# STM32 が yaw_rate に掛けているローパスの時定数 [s]（観測だけに効く）。走行中1.0m/sと低速0.2m/sの
# 舵のステップの過渡から切り分ける。0 = 無し
yaw_relaxation_m = 0.0
yaw_rate_filter_s = 0.01657499274805864
# 曲率の2次遅れ（振動的なヨー応答。緩和長の後に時間で掛ける。車の動きに効く）の
# 固有角振動数 [rad/s] と減衰比。1次の遅れより有意に合うときだけ入る。0 = 無し
yaw_natural_freq_rad_s = 70.29037538741512
yaw_damping = 0.6837508371821752
# 実効舵角のオフセット [rad]。正 = 左へ曲がる（直線の定速区間から）
steer_offset_rad = 0.00345217599866765
# アンダーステア勾配 K [rad/(m/s²)]。δ = L/R + K·a_y（旋回の限界より下の区間から）。0 = 限界まで狙いどおり
understeer_gradient = 0.0
# ── ② 前後運動試験（`sysid_accel`）の続き: 加減速の上限。`SpeedController` の出力誤差（制動だけは速度の傾き）──
# 駆動加速度の上限 [m/s²]（モータ・TC で出せる上限）。0 = ランプと PI の出力上限のほかに上限なし。
# ファームは目標を speed_ramp_max_m_s2 でランプさせるので、それより高い上限は観測できず 0 になる。
# 旧手順は IMU の |accel_x| の95パーセンタイルで、振動・傾き・バイアスで上振れしていた。
# 2026-09-28 実測（TC 込み）。ランプ 3.0 より高いので PI が目標に追いつく瞬間しか効かず、値の確かさは低いが
# 学習環境の挙動への影響も小さい
drive_accel_m_s2 = 3.4195344895670994
# 駆動加速度の上限が落ち始める速度・0になる速度 [m/s]（間は線形）。0 = 減衰なし。
# 2m の直線で出せるのは約2m/sまでなので、それより上は外挿
drive_fade_speed_m_s = 0.0
drive_top_speed_m_s = 0.0
# 制動（brake）の減速度の頭打ち [m/s²]。**ABS が保つグリップの上限**（2026-09-28 実測、ABS を作り直した
# ファーム）。ABS の定数を変えたら測り直すこと。学習環境は brake を使わないので影響しない
brake_decel_m_s2 = 2.7498698729383206
# 制動トルク（1輪あたり、COMMAND.brake_torque）→ 減速度の傾き [(m/s²)/(N·m)]。減速度 = この値×トルク
# ＋rolling_resistance（brake_decel_m_s2 で頭打ち）。前後運動試験のブレーキを3段の強さで掛けて測る。
# 0 = 未実測（シムは名目の式 トルク×drive_ratio/(車輪半径×質量) ≒ 33/N·m）。2026-09-28 実測（4段の強さ）
brake_decel_per_nm = 33.998241711639196
# MD の制動の境界層と不感帯 [m/s]。**同定しない。MD のファームの定数**（BLDC/ProgramV4 src/app/config.h の
# BRAKE_BOUNDARY_SPEED_RAD_S 20・BRAKE_DEADBAND_SPEED_RAD_S 2 [rad/s] × 後輪半径0.03m）。MD は制動の電流を
# 「強さ × tanh(車輪の角速度 ÷ 境界層)」にし、不感帯より遅いと0にする。MD を変えたらここも直すこと
brake_boundary_speed_m_s = 0.6
brake_deadband_speed_m_s = 0.06
# 速度指令を下げたときの減速度上限 [m/s²]（brake とは別）。0 = ランプと PI の出力上限のほかに上限なし
# （speed_kp = 0 の旧モデルでは drive_accel_m_s2 と同じ）
speed_decel_m_s2 = 0.0
# ── ④ 遅延試験（`sysid_latency`）──
# LiDAR スキャン完了 → STM32 が COMMAND を受理するまで [s]。実ノードを通さない
# 学習環境（ml_lidar/env.py）が指令をこれだけ遅らせる。0 = 遅延なし。2026-09-28 実測（中央値）
control_latency_s = 0.010385627571403155
# ── 対象外 ──
drive_ratio = 2.0             # 駆動輪数（後輪2輪ぶんのトルクが効く）

# ── センサ取付位置 ──────────────────────────────────────────────────────
# base_link からの固定変換。実測確定（2026-08-20）。

[sensors.lidar]
x = 0.07
y = 0.0
z = 0.110
yaw = 0.0
# LD06 は裏向きに実装されているため、センサ角と車両角が鏡像関係になる。
# その反転は `raspi/msgs/convert.py` の ScanAssembler が行う（ここでは表現しない）
mirrored = true

[sensors.cam_front]
# ★付いているレンズ。下の `[sensors.cam_front.lenses.<名前>]` から選ぶ。
# **レンズを付け替えたらここだけ直して `tools/deploy.sh --restart`。**
#   "stock"   … 純正 IMX219（水平 ≒66°）
#   "wide160" … IMX219 160° 広角（魚眼）
# 名前に `_` は使わない（📷 のファイル名に入る）。
# **取付位置・姿勢（x y z roll pitch yaw）もレンズごとのプロファイルに持つ**（カメラモジュールを
# 替えるとステーも変わるので、替える前の実測値を消さずに残すため）
lens = "wide160"

# ── レンズごとの値。項目の意味 ──
# x y z          [m] base_link（後輪車軸中心）基準の取付位置。z は路面からの高さ（レンズ中心）
# roll pitch yaw [rad] 取付姿勢。pitch は下向きが正。取り付け角度そのもの＝付け直さない限り変わらない
# hfov           [rad] 水平画角。**`fisheye`（校正値）が無い間だけ**ピンホール近似に使う。
#                ピンホールは 180° に届かないので、校正後もここは書き換えない
#                （実測の画角は `fisheye.hfov_deg` に参考値として入る）
# bottom_crop    下端カット率。ボンネット等の映り込みを ISP の ScalerCrop で読み出し時に切る
#                （`raspi/nodes/camera_node.py` の `bottom_cropped`）。GUI の進路ガイドの主点補正にも使う
# undistort_hfov [rad] 補正映像（GUI の「魚眼/補正」、`telemetry_node`）の仮想ピンホールの水平画角
# fisheye        魚眼の校正値（`[….lenses.<名前>.fisheye]`）。**手で書かない。** チェッカーボード
#                写真から `tools/cam_calib`（ランチャーの「カメラ校正」）が書く。値の意味は
#                `raspi/core/camera_model.py`（Kannala-Brandt、フル画角・クロップ前の画素）。
#                無ければ未校正＝`hfov` のピンホール

[sensors.cam_front.lenses.stock]
x = 0.097
y = 0.0
z = 0.085
roll = 0.0
pitch = 0.0
yaw = 0.0
hfov = 1.152                  # ≒66°
bottom_crop = 0.25            # 下1/4
undistort_hfov = 1.152        # 歪みが小さいので補正しても画角はほぼそのまま

[sensors.cam_front.lenses.wide160]
x = 0.097                     # ★仮（stock と同じ）。実測して直す
y = 0.0
z = 0.085                     # ★仮
roll = 0.0
pitch = 0.0                   # ★仮
yaw = 0.0
hfov = 2.23                   # ≒128°。公称（対角160°）からの概算。校正するまでの仮
bottom_crop = 0.25            # ★仮（純正と同じ）。画角が変わりボンネットの写り方も変わるので実機で見直す
undistort_hfov = 1.92         # ≒110°

[sensors.cam_rear]
lens = "wide160"              # 意味は cam_front と同じ（前後で別のレンズにしてよい）

[sensors.cam_rear.lenses.stock]
x = 0.044
y = 0.0
z = 0.085
roll = 0.0
pitch = 0.0
yaw = 3.14159265
hfov = 1.152
bottom_crop = 0.0625          # 下1/16
undistort_hfov = 1.152

[sensors.cam_rear.lenses.wide160]
x = 0.044                     # ★仮（stock と同じ）。実測して直す
y = 0.0
z = 0.085                     # ★仮
roll = 0.0
pitch = 0.0                   # ★仮
yaw = 3.14159265
hfov = 2.23                   # 仮（cam_front と同じ）
bottom_crop = 0.0625          # ★仮。実機で見直す
undistort_hfov = 1.92

[sensors.us_front]
x = 0.26
y = 0.0
z = 0.060
yaw = 0.0

[sensors.us_rear]
x = -0.040
y = 0.0
z = 0.060
yaw = 3.14159265
