# SURGE Mark.2 UART プロトコル定義（唯一の正）
#
# このファイルが Pi 側 Python パーサと STM32 側 C ヘッダの**両方**を生成する。
# 仕様の説明は docs/uart_protocol.md を参照。数値の正はこのファイル。
#
#   再生成:  python3 raspi/proto/generate.py
#
# 型:  u8 i8 u16 i16 u32 i32 f32  /  count = 配列長  /  bytes = 可変長（末尾のみ）
# dir: "s2p" = STM32 → Pi,  "p2s" = Pi → STM32
#
# scale は「LSB あたりの SI 値」。raw * scale = SI 単位の値。

[meta]
protocol_version = 0x001D      # 上位=メジャー 下位=マイナー
doc = "docs/uart_protocol.md"

[frame]
sync = [0xAA, 0x55]
header_size = 5                # SYNC(2) + TYPE(1) + SEQ(1) + LEN(1)
crc_size = 2
overhead = 7
endian = "little"
max_payload = 255

[crc]
name = "CRC-16/CCITT-FALSE"
poly = 0x1021
init = 0xFFFF
refin = false
refout = false
xorout = 0x0000
check = 0x29B1                 # "123456789" の CRC


# ─────────────────────────────────────────────────────────────
# STM32 → Pi
# ─────────────────────────────────────────────────────────────

[[packets]]
name = "LIDAR_SECTOR"
type = 0x01
dir = "s2p"
len = 69
rate_hz = 120
doc = "1周360点を12セクタに分割。角度は sector_idx*30 + i [deg]"
fields = [
  { name = "sector_idx",    type = "u8" },
  { name = "t_start_us",    type = "u32", unit = "us" },
  { name = "duration_us",   type = "u16", unit = "us" },
  { name = "rot_speed_dps", type = "u16", scale = 1.0, unit = "deg/s" },
  { name = "dist",          type = "u16", count = 30, scale = 0.001, unit = "m", note = "0=無効" },
]

[[packets]]
name = "TELEMETRY"
type = 0x02
dir = "s2p"
len = 102
rate_hz = 100  # 値の古さは平均5ms
doc = "車両状態。フィールド順は v0.4 確定版（wheel_speed → odom_dist → accel）。★v0.13で slip/tc_limit_nm、★v0.16で torque_req/abs_limit_nm/yaw_rate_target/tv_moment_nm を追加、★v0.17で yaw_rate_target を tv_ratio に置き換え（オフセット・LEN は同じ）"
fields = [
  { name = "t_us",                type = "u32", unit = "us" },
  { name = "flags",               type = "u32", note = "FLG_* 参照" },
  { name = "speed",               type = "i16", scale = 0.001,  unit = "m/s",   note = "車体中心線方向に射影済み" },
  { name = "yaw_rate",            type = "i16", scale = 0.001,  unit = "rad/s" },
  { name = "steer_actual",        type = "i16", scale = 0.0001, unit = "rad",   note = "路面舵角" },
  { name = "steer_cmd_echo",      type = "i16", scale = 0.0001, unit = "rad" },
  { name = "wheel_speed",         type = "i16", count = 4, scale = 0.001, unit = "m/s", note = "[FL,FR,RL,RR] 射影なし" },
  { name = "odom_dist",           type = "i32", count = 2, scale = 0.0001, unit = "m",  note = "[FL,FR] 射影なし・累積" },
  { name = "accel_x",             type = "i16", scale = 0.001,  unit = "m/s2" },
  { name = "accel_y",             type = "i16", scale = 0.001,  unit = "m/s2" },
  { name = "accel_z",             type = "i16", scale = 0.001,  unit = "m/s2" },
  { name = "pitch",               type = "i16", scale = 0.0001, unit = "rad" },
  { name = "roll",                type = "i16", scale = 0.0001, unit = "rad" },
  { name = "motor_current",       type = "i16", count = 3, scale = 0.001, unit = "A", note = "[RL,RR,ST] 双方向" },
  { name = "torque_cmd",          type = "i16", count = 2, scale = 0.0001, unit = "N.m", note = "[RL,RR] 指令値" },
  { name = "slip",                type = "i16", count = 2, scale = 0.0001, note = "[RL,RR] TC用スリップ率。正=空転 負=ロック傾向。基準速度が低いと無効区間は0 ★v0.13" },
  { name = "tc_limit_nm",         type = "i16", count = 2, scale = 0.0001, unit = "N.m", note = "[RL,RR] TCが動的に決めているトルク上限。介入していなければ DRIVE_MAX_TORQUE_NM と同じ ★v0.13" },
  { name = "torque_req",          type = "i16", count = 2, scale = 0.0001, unit = "N.m", note = "[RL,RR] スリップ制限（TC・片輪浮き対策・ABS）が絞る前に掛けたかったトルク。駆動は TV の左右差を載せた後、制動は要求の制動トルク（負）。torque_cmd との差が絞った量 ★v0.16" },
  { name = "abs_limit_nm",        type = "i16", scale = 0.0001, unit = "N.m", note = "ABS が決めている制動トルクの上限（左右共通）。働いていなければ DRIVE_MAX_TORQUE_NM と同じ ★v0.16" },
  { name = "tv_ratio",            type = "i16", scale = 0.0001, note = "TV の配分の比率 = 左右の荷重差/荷重和 の見積り（左旋回で正 = 右輪が多い。上限で丸めた後）。左右差 = 総駆動トルク × これ。IMU が使えない間・駆動していない間は 0 ★v0.17（v0.16 はこの位置に yaw_rate_target、0.001 rad/s）" },
  { name = "tv_moment_nm",        type = "i16", scale = 0.0001, unit = "N.m", note = "TV が要求した左右トルク差をヨーモーメントに換算した値（左旋回が正）。実際に付いた左右差は torque_cmd ★v0.16" },
  { name = "temp",                type = "u8",  count = 4, scale = 1.0, unit = "degC", note = "[RL,RR,ST,MCU]" },
  { name = "batt_voltage_drive",  type = "u8",  scale = 0.05, unit = "V" },
  { name = "batt_voltage_signal", type = "u8",  scale = 0.05, unit = "V" },
  { name = "batt_current_drive",  type = "u8",  scale = 0.05, unit = "A", note = "単方向" },
  { name = "batt_current_signal", type = "u8",  scale = 0.02, unit = "A", note = "単方向" },
  { name = "us_front",            type = "u8",  scale = 0.02, unit = "m", note = "0=無効" },
  { name = "us_rear",             type = "u8",  scale = 0.02, unit = "m", note = "0=無効" },
  { name = "md_status",           type = "u8",  count = 3, note = "[RL,RR,ST] MDS_* 参照" },
  { name = "cmd_seq_echo",        type = "u8" },
  { name = "accel_kf",            type = "i16", scale = 0.001,  unit = "m/s2",  note = "カルマンフィルタの加速度 ★v0.24" },
  { name = "accel_bias_kf",       type = "i16", scale = 0.001,  unit = "m/s2",  note = "カルマンフィルタの加速度計バイアス（重力の傾き成分を含む）★v0.24" },
  { name = "kf_gated",            type = "u16", note = "カルマンフィルタが測定を弱めた累積回数（16bitで巻き戻る。前輪のロック・衝撃の目安）★v0.24" },
  { name = "kf_z_rms_dist",       type = "u16", scale = 0.001,  note = "走行距離の残差の z の RMS（=√NIS。前提が合っていれば1。0=その間に測定なし）★v0.26" },
  { name = "kf_z_rms_accel",      type = "u16", scale = 0.001,  note = "加速度の残差の z の RMS ★v0.26" },
  { name = "kf_rho_dist",         type = "i16", scale = 0.0001, note = "走行距離の残差の隣り合う相関係数（-1〜1。前提が合っていれば0）★v0.26" },
  { name = "kf_rho_accel",        type = "i16", scale = 0.0001, note = "加速度の残差の相関係数 ★v0.26" },
  { name = "front_angle",         type = "u16", scale = 0.0001, unit = "rad", count = 2, note = "[FL,FR] 前輪エンコーダの絶対角（0〜2π。取付向きの符号のまま。周期誤差の同定用）★v0.26。★v0.27 から校正前の生の読み（ADC÷フルスケール×2π。ENC_* に依らない）" },
]

[[packets]]
name = "CONFIG_ACK"
type = 0x03
dir = "s2p"
len = 7
fields = [
  { name = "param_id", type = "u16" },
  { name = "applied",  type = "f32" },
  { name = "result",   type = "u8", note = "0=OK 1=不明ID 2=範囲外 3=変更不可" },
]

[[packets]]
name = "LOG"
type = 0x04
dir = "s2p"
variable = true
doc = "severity + ASCII 文字列（改行なし・NUL 終端なし）"
fields = [
  { name = "severity", type = "u8", note = "0=DEBUG 1=INFO 2=WARN 3=ERROR" },
  { name = "message",  type = "bytes" },
]

[[packets]]
name = "LIDAR_SECTOR_I"
type = 0x05
dir = "s2p"
len = 99
rate_hz = 120
doc = "強度付き。param 0x0040 = 1 のときのみ"
fields = [
  { name = "sector_idx",    type = "u8" },
  { name = "t_start_us",    type = "u32", unit = "us" },
  { name = "duration_us",   type = "u16", unit = "us" },
  { name = "rot_speed_dps", type = "u16", scale = 1.0, unit = "deg/s" },
  { name = "dist",          type = "u16", count = 30, scale = 0.001, unit = "m" },
  { name = "intensity",     type = "u8",  count = 30 },
]

[[packets]]
name = "PONG"
type = 0x06
dir = "s2p"
len = 12
fields = [
  { name = "ping_id",      type = "u32" },
  { name = "t_ping_rx_us", type = "u32", unit = "us", note = "T2: IDLE割り込みで取得" },
  { name = "t_pong_tx_us", type = "u32", unit = "us", note = "T3: 送信開始割り込みで取得" },
]

[[packets]]
name = "VERSION"
type = 0x07
dir = "s2p"
len = 10
fields = [
  { name = "protocol_version", type = "u16" },
  { name = "fw_id",            type = "u32" },
  { name = "build_epoch",      type = "u32", unit = "s" },
]

[[packets]]
name = "STATS"
type = 0x08
dir = "s2p"
len = 48
rate_hz = 1
doc = "すべて起動からの累積値。0クリアしない"
fields = [
  { name = "t_us",            type = "u32", unit = "us" },
  { name = "rx_frame_ok",     type = "u32" },
  { name = "rx_crc_error",    type = "u32" },
  { name = "rx_len_error",    type = "u32" },
  { name = "rx_unknown_type", type = "u32" },
  { name = "tx_drop",         type = "u32" },
  { name = "md_rx_count",     type = "u32", count = 3, note = "[RL,RR,ST]" },
  { name = "md_rx_error",     type = "u32", count = 3, note = "[RL,RR,ST]" },
]

[[packets]]
name = "LIMITS"
type = 0x0A
dir = "s2p"
len = 16
doc = "車両の物理的な上限値（読み取り専用・実行時に変化しない）。★v0.11 新設。起動直後に VERSION と同じタイミングで自動送信（100ms間隔×3回）、任意タイミングでも LIMITS_REQ で再取得可"
fields = [
  { name = "max_speed_m_s",  type = "f32", unit = "m/s",  note = "COMMAND.target_speed の上限（DRIVE_MAX_SPEED_M_S）。超えると STM32 側でクランプされる" },
  { name = "max_accel_m_s2", type = "f32", unit = "m/s2", note = "COMMAND.accel_limit に指定できる上限。★v0.22 から STM32 は上限を掛けず、ワイヤで表せる最大 65.535 を返す（上限は Pi の [safety] cmd_accel_limit_m_s2）" },
  { name = "max_torque_nm",  type = "f32", unit = "N.m",  note = "1輪あたり。target_torque/brake_torque 共通（DRIVE_MAX_TORQUE_NM）" },
  { name = "max_steer_rad",  type = "f32", unit = "rad",  note = "路面舵角。原点(直進)からの片側振れ幅（Steering_GetMaxRoadWheelAngleRad()）" },
]

[[packets]]
name = "LIDAR_SECTOR_C"
type = 0x09
dir = "s2p"
len = 39
rate_hz = 120
doc = "距離1バイト圧縮。param 0x0040 = 2 のときのみ。255 = 5.10m 以上（飽和）"
fields = [
  { name = "sector_idx",    type = "u8" },
  { name = "t_start_us",    type = "u32", unit = "us" },
  { name = "duration_us",   type = "u16", unit = "us" },
  { name = "rot_speed_dps", type = "u16", scale = 1.0, unit = "deg/s" },
  { name = "dist",          type = "u8", count = 30, scale = 0.02, unit = "m", note = "0=無効 255=飽和" },
]


# ─────────────────────────────────────────────────────────────
# Pi → STM32
# ─────────────────────────────────────────────────────────────

[[packets]]
name = "COMMAND"
type = 0x10
dir = "p2s"
len = 15
rate_hz = 100
fields = [
  { name = "mode",             type = "u8", note = "0=DISARM 1=MANUAL 2=AUTO (3=予約)" },
  { name = "flags",            type = "u8", note = "bit0=arm bit1=brake bit2=horn bit3-4=light_mode bit5=passing bit6=torque_mode bit7=auto_stop" },
  { name = "target_speed",     type = "i16", scale = 0.001,  unit = "m/s" },
  { name = "target_steer",     type = "i16", scale = 0.0001, unit = "rad", note = "路面舵角" },
  { name = "accel_limit",      type = "u16", scale = 0.001,  unit = "m/s2" },
  { name = "steer_rate_limit", type = "u16", scale = 0.001,  unit = "rad/s" },
  { name = "brake_torque",     type = "u16", scale = 0.0001, unit = "N.m", note = "後輪各輪。0=未指定(最大で制動)" },
  { name = "target_torque",    type = "i16", scale = 0.0001, unit = "N.m", note = "駆動トルク直接指令。torque_mode時のみ有効、負は後退方向 ★v0.6" },
  { name = "flags2",           type = "u8", note = "bit0=side_brake（速度に関わらず即座に後輪を位置制御へ切替え固定。brakeより優先）★v0.13 bit1=winker_left bit2=winker_right（両方立てばハザード）★v0.14 bit3=launch（車速指令の、目標が車速より大きく離れた加速＝発進を、ランプと車速PIを迂回して全開＋TCで行う）★v0.20" },
]

[[packets]]
name = "CONFIG_SET"
type = 0x11
dir = "p2s"
len = 6
fields = [
  { name = "param_id", type = "u16" },
  { name = "value",    type = "f32" },
]

[[packets]]
name = "PING"
type = 0x12
dir = "p2s"
len = 4
rate_hz = 5
fields = [
  { name = "ping_id", type = "u32" },
]

[[packets]]
name = "CONFIG_GET"
type = 0x13
dir = "p2s"
len = 2
fields = [
  { name = "param_id", type = "u16" },
]

[[packets]]
name = "VERSION_REQ"
type = 0x14
dir = "p2s"
len = 0
doc = "ペイロードなし。応答は VERSION (0x07)"
fields = []

[[packets]]
name = "LIMITS_REQ"
type = 0x15
dir = "p2s"
len = 0
doc = "ペイロードなし。応答は LIMITS (0x0A)。★v0.11 新設"
fields = []


# ─────────────────────────────────────────────────────────────
# ビット定義・enum（C ヘッダにも出力する）
# ─────────────────────────────────────────────────────────────

[bits.FLG]
comment = "TELEMETRY.flags (u32)"
MODE_MASK                 = 0x00000003   # bit0-1
ARMED                     = 0x00000004   # 上位の指令で走れる状態。v0.18 までは「駆動電源 ON」だった（v0.19）
ESTOP_ACTIVE              = 0x00000008
UART_TIMEOUT              = 0x00000010
TC_ACTIVE                 = 0x00000020
TV_ACTIVE                 = 0x00000040
IMU_OK                    = 0x00000080
LIDAR_OK                  = 0x00000100
# bit9 は予約（旧 calib_running）
STEER_CENTER_VALID        = 0x00000400
FAULT_DRIVE_OVERCURRENT   = 0x00000800
FAULT_SIGNAL_OVERCURRENT  = 0x00001000
FAULT_DRIVE_UNDERVOLTAGE  = 0x00002000
FAULT_SIGNAL_UNDERVOLTAGE = 0x00004000
DRIVE_POWER_LOCKED        = 0x00008000
AUTO_STOP_ACTIVE          = 0x00010000   # v0.7: 前後超音波の自動停止が実際に制動へ介入中
SIDE_BRAKE_ACTIVE         = 0x00020000   # v0.13: サイドブレーキが実際に位置制御へ切り替わり固定中
WINKER_LEFT_ACTIVE        = 0x00040000   # v0.14: 左ウィンカーが実際に点滅中
WINKER_RIGHT_ACTIVE       = 0x00080000   # v0.14: 右ウィンカーが実際に点滅中
ABS_ACTIVE                = 0x00100000   # v0.15: ABSが制動トルクを要求より削っている最中（フォールバック中は偽）
WHEEL_LIFT_ACTIVE         = 0x00200000   # v0.16: 片輪浮き対策がトルクを削っている最中（このとき TC_ACTIVE は立たない）
DRIVE_POWER_ON            = 0x00400000   # v0.19: 駆動電源が入っている（ARM が外れたあと停車を待つ制動中も立つ）
MD_FAULT                  = 0x00800000   # v0.19: MD のいずれかが使えず走行を止めている（駆動電源が切れるまでラッチ）
LAUNCH_ACTIVE             = 0x01000000   # v0.20: ローンチコントロールで発進している最中（要求していても、始まらなかった・終わった後は立たない）
NO_HEARTBEAT              = 0x02000000   # ハートビート（RAS_SIG）を一度も検出していない＝E-Stop の層が働いていない。古い STM32 では常に 0
AUTO_STOP_BLIND           = 0x04000000   # ARM 中に LiDAR も前後の超音波も使えず、自動停止が何も検知できない状態が続いている。古い STM32 では常に 0

[bits.MDS]
comment = "md_status[i] (u8)"
RUNNING          = 0x01   # MD が受理済みの指令を実行中（停止モードでない）。「回転中」ではない
VOLTAGE_OOR      = 0x02
OVERHEAT         = 0x04
OVERCURRENT      = 0x08
COMM_OK          = 0x10
LIMIT_SYNCED     = 0x20
UNCALIBRATED     = 0x40   # v0.19: MD のエンコーダが未校正（MD は動かない）

[bits.CMD_FLG]
comment = "COMMAND.flags (u8)。light_mode は bit3-4 の2ビット幅 = (mode << LIGHT_SHIFT) & LIGHT_MASK"
ARM         = 0x01
BRAKE       = 0x02
HORN        = 0x04   # v0.5: 立てている間ずっと鳴る（v0.4 は立ち上がりで単発）
LIGHT_MASK  = 0x18   # bit3-4 = LIGHT_MODE_*
LIGHT_SHIFT = 0x03   # マスクではなくシフト量
PASSING     = 0x20
TORQUE_MODE = 0x40   # v0.6: 立っている間 target_speed を無視し target_torque を直接掛ける（brakeと同様PI迂回。brake優先）
AUTO_STOP   = 0x80   # v0.7: 立っている間、進行方向の超音波が20cm未満で STM32 が自動的に最大制動（brake優先）

[bits.CMD_FLG2]
comment = "COMMAND.flags2 (u8)。★v0.13 新設"
SIDE_BRAKE   = 0x01   # v0.13: 立てている間、速度に関わらず即座に後輪を機械的に位置制御へ切り替えて固定（brakeより優先）
WINKER_LEFT  = 0x02   # v0.14: 左ウィンカー点滅。両方立てば左右同時点滅（ハザード）として扱う
WINKER_RIGHT = 0x04   # v0.14: 右ウィンカー点滅
LAUNCH       = 0x08   # v0.20: ローンチコントロール。立っている間、車速指令の目標車速が車速より 0.5m/s 以上速い加速（発進）を、目標車速のランプと車速PIを迂回して全開のトルク＋TC で目標車速まで行う（1回の要求で1回）。brake・torque_mode・side_brake の間は無視

[enums.MODE]
comment = "COMMAND.mode / TELEMETRY.flags bit0-1"
DISARM = 0
MANUAL = 1
AUTO   = 2

[enums.LIGHT_MODE]
comment = "COMMAND.flags bit3-4。**v0.4 の light=1 は NORMAL だったが v0.5 の 1 は DAYTIME**"
OFF     = 0
DAYTIME = 1
NORMAL  = 2

[enums.LOG_SEVERITY]
DEBUG = 0
INFO  = 1
WARN  = 2
ERROR = 3

[enums.CONFIG_RESULT]
OK           = 0
UNKNOWN_ID   = 1
OUT_OF_RANGE = 2
NOT_ALLOWED  = 3

[enums.LIDAR_FORMAT]
comment = "param_id 0x0040"
NORMAL     = 0
INTENSITY  = 1
COMPRESSED = 2

[params]
comment = "CONFIG_SET / CONFIG_GET の param_id"
# MAX_SPEED/MAX_ACCEL/MAX_STEER: v0.10でSTM32側が廃止し、STM32側の固定定数
# （DRIVE_MAX_SPEED_M_S等）へ一本化された。常にUNKNOWN_IDを返す。
# Piは元々Flash非永続化・動的変更のユースケース無しを理由に意図的に未送信だったため、
# Pi側の挙動に変化は無い。
MAX_SPEED      = 0x0001  # 廃止（STM32側が UNKNOWN_ID を返す。v0.10）
MAX_ACCEL      = 0x0002  # 廃止（同上）
MAX_STEER      = 0x0003  # 廃止（同上）
# TC_ENABLE/TV_ENABLE: v0.8でSTM32ファームウェアが実装済み（以前は未実装で
# RAS_CONFIG_UNKNOWN_PARAM を返していた）。Pi側から実際に送信する（raspi/nodes/io_node.py）。
TC_ENABLE      = 0x0010
# ── 足回りの制御の調整パラメータ（★v0.16。TC・ABS・片輪浮き対策・TV）──
# **名前・範囲・既定値の唯一の定義は STM32 側 `src/control/control_params.h` の表。** ここは
# param_id だけを写したもので、名前は表のフィールド名の大文字（`config/vehicle.toml` の `[control]`
# のキーは小文字）。値は `[control]` に書き、io_node が接続のたびに送って `CONFIG_ACK.applied`
# と突き合わせる（`raspi/core/control_params.py`。Flash には保存されない）。
# 値を決める手順は車両の校正（`docs/calibration.md`、`tools/calib`）。0x0011 は v0.15 まで未実装の TC_SLIP_THRESH だった
TC_SLIP_TARGET       = 0x0011
TC_KP_NM_PER_M_S     = 0x0012
TC_KI_NM_PER_M       = 0x0013
TC_MIN_TORQUE_NM     = 0x0014
SLIP_SPEED_FLOOR_M_S = 0x0015
TV_ENABLE      = 0x0020
# 0x0021〜0x0029 は欠番（v0.16 のヨーレート PI の調整パラメータ。★v0.17 で TV を荷重比例の配分に
# 置き換えて廃止。STM32 は UNKNOWN_ID を返す）
TV_TEST_MOMENT_NM         = 0x002A  # 同定用。0 以外の間は TV の配分を止めてこのヨーモーメントだけを出す
TV_LOAD_GAIN_S2_PER_M     = 0x002B  # ★v0.17。配分の比率 = これ × 横加速度（車速×ヨーレート）
TV_MAX_RATIO              = 0x002C  # ★v0.17。比率の上限（1 で内輪のトルクが 0）
# ステアのリンクの換算（★v0.18）: 路面舵角 = gain·x + cubic·x³、x = モータ角×0.5。STM32 は入れた瞬間に
# 反映し、LIMITS（max_steer_rad）を送り直す。値はシステム同定が `[control]` に書く
STEER_LINK_GAIN           = 0x0081
STEER_LINK_CUBIC          = 0x0082
# ローンチコントロール（★v0.20。`COMMAND.flags2` の LAUNCH）: 発進を終えて車速PIへ戻すときの積分の初期値
# [N·m、1輪あたり] = その車速を保つのに要るトルク。値は `[control]`（`[dynamics]` の同定値から決める）
LAUNCH_EXIT_TORQUE_NM     = 0x00A1
# 車速PIの加速度フィードフォワード（★v0.21）: 車速PIの出力に
#   SPEED_FF_NM_PER_M_S2 × 目標車速の傾き [m/s²] ＋ SPEED_FF_RR_NM × 進む向き
# を足す（どちらも後輪2輪の合計トルク [N·m]）。0 で無し（既定）。値は `[control]`——`[dynamics]` の同定値から
#   SPEED_FF_NM_PER_M_S2 = 1 ÷ speed_plant_gain、SPEED_FF_RR_NM = rolling_resistance ÷ speed_plant_gain
# （校正 5 の車速制御が書く）。目標車速の傾きは COMMAND の accel_limit で決まる
SPEED_FF_NM_PER_M_S2      = 0x00B1
SPEED_FF_RR_NM            = 0x00B2
# 前輪エンコーダの校正（★v0.27。STM32 `lib/encoder_cal`）: 角度 0・2π に当たる ADC の読みの比 lo・hi と、
# 1回転の周期誤差 e(θ) = h1s·sinθ + h1c·cosθ + h2s·sin2θ + h2c·cos2θ [rad]（θ は取付向きの符号のまま）。
# 値は `[control]`（校正 1 の前輪エンコーダ `calib_encoder` が書く）。既定は lo=0・hi=1・係数 0（校正なし）
ENC_LEFT_LO               = 0x00C1
ENC_LEFT_HI               = 0x00C2
ENC_LEFT_H1S              = 0x00C3
ENC_LEFT_H1C              = 0x00C4
ENC_LEFT_H2S              = 0x00C5
ENC_LEFT_H2C              = 0x00C6
ENC_RIGHT_LO              = 0x00C9
ENC_RIGHT_HI              = 0x00CA
ENC_RIGHT_H1S             = 0x00CB
ENC_RIGHT_H1C             = 0x00CC
ENC_RIGHT_H2S             = 0x00CD
ENC_RIGHT_H2C             = 0x00CE
# 車速のカルマンフィルタの調整値（★v0.27。`speed_kf.h`）。既定は v0.26 の固定値と同じ
KF_SIGMA_S_M              = 0x00E1  # 走行距離の測定ノイズ [m]
KF_SIGMA_A_M_S2           = 0x00E2  # 加速度の測定ノイズ [m/s²]（車速 0 のとき）
KF_SIGMA_A_PER_M_S        = 0x00E3  # 同 車速 1m/s あたりの増え方
KF_JERK_PSD               = 0x00E4  # [m²/s⁵]
KF_BIAS_WALK_PSD          = 0x00E5  # [(m/s²)²/s]
KF_LEVER_ARM_M            = 0x00E6  # 旋回で加速度計に乗る −k·ω² の補正 [m]
# ★v0.28: ジャイロ z 軸の感度の補正（倍率、0.9〜1.1、既定 1）。STM32 の imu.c がバイアスを引いた後の z に掛ける。
# 値は `[control]`（手で置く。既定 1 = 補正なし）
IMU_GYRO_Z_SCALE          = 0x00F1
# ★v0.29: 自動停止の停止距離・DISARM 後の制動の上限の見積もり（STM32 の vehicle.c）。ファームは値を持たない。
# 値は `vehicle.toml` の `[limits] abs_brake_decel_m_s2`（校正 9）と `[control.plant] md_delay_s + md_tau_s`（校正 6）
BRAKE_DECEL_M_S2          = 0x0101  # 制動モード（ABS 込み）の減速度 [m/s²]（0.5〜10）
MD_TORQUE_LAG_S           = 0x0102  # MD のトルクの遅れ [s]（0〜0.1）。自動停止の遅れ = LiDAR の1回転 + これ
# 車速PIのゲイン（★v0.23）。値は `vehicle.toml` の `[dynamics]` speed_kp / speed_ki（同定・シム・Pi の計算と共通）
SPEED_KP       = 0x0030  # 比例 [N·m/(m/s)]
SPEED_KI       = 0x0031  # 積分 [N·m/(m/s)/s]
LIDAR_FORMAT   = 0x0040
# WHEEL_LIFT_GUARD_ENABLE: v0.9でSTM32ファームウェアが実装済み（後輪片浮きの検知・
# トルク遮断）。TC_ENABLE/TV_ENABLE本体とは独立に動く別機構。Pi側から実際に送信する
# （raspi/nodes/io_node.py）。
WHEEL_LIFT_GUARD_ENABLE = 0x0050
WHEEL_LIFT_DIFF_THRESHOLD_M_S = 0x0051  # ★v0.16（調整パラメータ。v0.15 まで未実装の WHEEL_LIFT_GUARD_THRESH）
# AUTO_STOP_MARGIN_CM: v0.12でSTM32ファームウェアが実装済み。自動停止（COMMAND.flags
# bit7=AUTO_STOP）が使う安全マージンをcm単位の連続値で直接指定する（段階enumではない。
# 当初案は3段階enumだったが実機投入前にSTM32側がcm直接指定へ変更した）。
# 範囲 0.0-100.0、既定15.0。未送信ならSTM32側の既定15cmのまま
# （pi_uart_protocol_v0.12_delta.md）
AUTO_STOP_MARGIN_CM = 0x0060
# ABS_ENABLE: v0.15でSTM32ファームウェアが実装済み（制動モード＝brake・自動停止・フェイルセーフの
# 最大制動で後輪のロックを防ぐ。車速PIの減速・torque_modeの負トルクには掛からない）。既定は有効。
# TC_ENABLE と同じ bool（0.0/1.0）。Pi側から実際に送信する（raspi/nodes/io_node.py）
ABS_ENABLE = 0x0070
# BRAKE_HOLD_ENABLE: ★v0.19。ブレーキホールド（制動して止まったら後輪の位置保持へ自動で移る。
# 実車のブレーキホールドに当たる）。brake・自動停止・フェイルセーフのどの制動でも働く。既定は有効。
# TC_ENABLE と同じ bool（0.0/1.0）
BRAKE_HOLD_ENABLE = 0x0090
ABS_SLIP_TARGET   = 0x0071  # ★v0.16（調整パラメータ）
ABS_KP_NM_PER_M_S = 0x0072
ABS_KI_NM_PER_M   = 0x0073
