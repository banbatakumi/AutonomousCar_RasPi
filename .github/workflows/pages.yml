# 技術解説サイト（surge_mk2/site）を GitHub Pages に公開する。
#
# - pull_request: ビルドが通るかだけを確かめる（--strict なので壊れたリンクで落ちる）
# - master への push: ビルドして公開する
#
# **リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと**（初回のみ）。
name: pages

on:
  push:
    branches: [master]
    paths: ['surge_mk2/site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['surge_mk2/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: surge_mk2/site/requirements.txt
      - run: pip install -r surge_mk2/site/requirements.txt
      - name: ビルド（--strict）
        working-directory: surge_mk2/site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: surge_mk2/site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
